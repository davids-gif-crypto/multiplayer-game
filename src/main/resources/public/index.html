<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Fight</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    The whole game is this one page. Each <section class="screen"> is one
    screen, and ui.js shows one at a time by adding or removing "hidden".
  -->

  <!-- 1. HOME: pick a nickname, then create or join a room -->
  <section id="screen-home" class="screen">
    <div class="panel home-panel">
      <h1 class="logo">Food Fight</h1>
      <p class="tagline">A cafeteria brawl on a lunch tray</p>

      <label for="name-input">Your nickname</label>
      <input id="name-input" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="e.g. Sam">

      <button id="create-button" class="big" type="button" disabled>Create room</button>

      <p class="divider">or join a friend's room</p>
      <div class="join-row">
        <label for="code-input" class="visually-hidden">Room code</label>
        <input id="code-input" type="text" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE">
        <button id="join-button" type="button" disabled>Join</button>
      </div>

      <p id="home-error" class="error" role="alert"></p>
      <p id="home-status" class="status">Connecting to the server...</p>
    </div>
    <div class="howto-slot"></div>
  </section>

  <!-- 2. LOBBY: room code, players, fighter picking, Start -->
  <section id="screen-lobby" class="screen hidden">
    <div class="panel lobby-panel">
      <p class="label">Room code</p>
      <div id="lobby-code" class="room-code">----</div>
      <div class="copy-row">
        <button id="copy-link-button" class="small-button" type="button">Copy invite link</button>
        <span id="copy-feedback" class="hint"></span>
      </div>

      <h2>Players <span id="player-count" class="hint"></span></h2>
      <ul id="player-list" class="player-list"></ul>

      <h2>Pick your fighter</h2>
      <div id="fighter-cards" class="fighter-cards"></div>

      <div class="lobby-actions">
        <button id="start-button" class="big" type="button">Start match</button>
        <p id="start-hint" class="hint"></p>
        <p id="lobby-error" class="error" role="alert"></p>
        <button id="leave-button" class="secondary" type="button">Leave room</button>
      </div>
    </div>
    <div class="howto-slot"></div>
  </section>

  <!-- 3 and 4. COUNTDOWN and MATCH: one canvas that fills the window, with
       the timer and the big countdown numbers laid over it. -->
  <section id="screen-match" class="screen match-screen hidden">
    <canvas id="game-canvas"></canvas>
    <div id="match-timer" class="match-timer">5:00</div>
    <div id="countdown" class="countdown hidden"></div>
  </section>

  <!-- Shown when the WebSocket closes -->
  <div id="overlay-lost" class="overlay hidden">
    <div class="panel">
      <h2>Connection lost</h2>
      <p>The connection to the game server dropped. This can happen if the Wi-Fi blips or the server restarted.</p>
      <button id="reconnect-button" class="big" type="button">Reconnect</button>
    </div>
  </div>

  <!-- The "How to play" box. ui.js copies it into every .howto-slot. -->
  <template id="howto-template">
    <div class="panel howto-panel">
      <h2>How to play</h2>
      <p>Hit other fighters to raise their damage percent. The higher it gets, the further they fly. Knock them off the tray to take a life. Last one standing wins!</p>
      <table class="controls">
        <tr><td>Move</td><td><kbd>A</kbd> <kbd>D</kbd> or <kbd>&larr;</kbd> <kbd>&rarr;</kbd></td></tr>
        <tr><td>Jump (press again to double jump)</td><td><kbd>W</kbd> <kbd>Space</kbd> or <kbd>&uarr;</kbd></td></tr>
        <tr><td>Fast fall / drop through bread</td><td><kbd>S</kbd> or <kbd>&darr;</kbd></td></tr>
        <tr><td>Attack</td><td><kbd>J</kbd></td></tr>
        <tr><td>Special (coming soon)</td><td><kbd>K</kbd></td></tr>
        <tr><td>Shield (coming soon)</td><td><kbd>L</kbd></td></tr>
      </table>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
